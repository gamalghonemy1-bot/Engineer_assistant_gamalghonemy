name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files and generate Android project
        run: |
          mkdir -p lib
          mv -f main.dart lib/main.dart
          flutter create --platforms=android --project-name electrical_assistant --org com.eea _gen
          cp -r _gen/android android
          rm -rf _gen
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perm='<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n    <application'
          s=s.replace('<application',perm,1)
          s=s.replace('android:label="electrical_assistant"','android:label="مساعد كهرباء"')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
